version: "3.8"

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://revis.io:revis.io@postgres:5432/revis.io
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://rustfs:9000
  S3_PRESIGNED_ENDPOINT: http://localhost:9000
  S3_ACCESS_KEY: rustfsadmin
  S3_SECRET_KEY: rustfsadmin
  S3_BUCKET: revis.io
  S3_REGION: us-east-1
  SECRET_KEY: dev-secret-key-change-in-production
  RESEND_API_KEY: re_test_example
  EMAIL_FROM: Revis.io <noreply@revis.io.app>
  FRONTEND_URL: http://localhost:5173
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: revis.io
      POSTGRES_PASSWORD: revis.io
      POSTGRES_DB: revis.io
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revis.io"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rustfs:
    image: rustfs/rustfs:latest
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Console
    environment:
      RUSTFS_VOLUMES: /data/rustfs0
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      # Allow browser presigned uploads/downloads from the SPA.
      RUSTFS_CORS_ALLOWED_ORIGINS: http://localhost:5173
    volumes:
      - rustfs_data:/data/rustfs0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 40s

  rustfs-permissions:
    image: alpine
    volumes:
      - rustfs_data:/data
    command: sh -c "chown -R 10001:10001 /data && echo permissions-fixed"
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: arq src.services.thumbnail.WorkerSettings
    environment:
      <<: *common-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
